<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNT - Catálogo de Serviços</title>
    
    <link rel="icon" type="image/svg+xml" href="Logo-Simples.svg">
    <link rel="apple-touch-icon" href="Logo-Simples.svg">
    <meta name="apple-mobile-web-app-title" content="ZNT">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #001935;
            --blue-mid: #1E599C;
            --orange-neon: #FF6B00;
            --white-ice: #F4F7FA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--white-ice); overflow-x: hidden; min-height: 100vh; }

        .video-fundo { position: fixed; top: 0; left: 0; min-width: 100vw; min-height: 100vh; z-index: -2; object-fit: cover; opacity: 0.25; }
        .overlay-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 25, 53, 0.85); z-index: -1; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--blue-mid) 100%);
            border-bottom: 3px solid var(--orange-neon); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); position: relative; z-index: 10;
        }
        .logo-empresa { max-width: 180px; height: auto; filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.5)); }
        .navbar { display: flex; gap: 25px; }
        .navbar a { color: var(--white-ice); text-decoration: none; font-weight: 600; transition: color 0.3s ease; }
        .navbar a:hover { color: var(--orange-neon); }

        .hero { padding: 60px 5% 40px 5%; max-width: 1300px; margin: 0 auto; position: relative; }
        .hero h1 { font-weight: 800; line-height: 1.1; margin-bottom: 25px; color: var(--white-ice); }
        .hero h1 .highlight { color: var(--orange-neon); }
        .hero p { color: rgba(244, 247, 250, 0.8); line-height: 1.6; max-width: 700px; margin-bottom: 35px; }

        .btn-primario {
            background: var(--orange-neon); color: var(--white-ice); border: none; padding: 15px 30px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-primario:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4); }

        .filtros-wrapper {
            position: sticky; top: 0; z-index: 20; background: rgba(0, 25, 53, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 15px 0; margin-bottom: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .filtros { text-align: left; display: flex; gap: 10px; flex-wrap: wrap; padding: 0 5%; max-width: 1300px; margin: 0 auto; }
        .btn-filtro {
            background: rgba(244, 247, 250, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(244, 247, 250, 0.2);
            color: var(--white-ice); padding: 10px 25px; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; font-weight: 600;
        }
        .btn-filtro:hover, .btn-filtro.ativo { background: var(--blue-mid); border-color: var(--blue-mid); box-shadow: 0 4px 15px rgba(30, 89, 156, 0.4); }

        .container { max-width: 1300px; margin: 0 auto 60px auto; padding: 0 5%; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .cartao {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 30px; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: all 0.3s ease;
        }
        .cartao:hover { transform: translateY(-8px); border-color: rgba(255, 107, 0, 0.5); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); }
        
        .tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: bold; letter-spacing: 0.5px; }
        .tag-categoria { background: var(--blue-mid); color: var(--white-ice); }
        
        .cartao h3 { font-size: 1.5rem; margin-bottom: 12px; color: var(--white-ice); }
        .desc-curta { font-size: 0.95rem; color: rgba(244, 247, 250, 0.7); margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        .detalhes-tecnicos { background: rgba(0, 0, 0, 0.2); padding: 15px 20px; border-radius: 10px; margin-bottom: 25px; }
        .detalhes-tecnicos ul { list-style: none; }
        .detalhes-tecnicos li { font-size: 0.85rem; margin-bottom: 8px; display: flex; align-items: flex-start; color: rgba(244, 247, 250, 0.9); }
        .detalhes-tecnicos li::before { content: '✓'; color: var(--orange-neon); margin-right: 10px; font-weight: bold; }
        
        .rodape-cartao { display: flex; justify-content: flex-end; align-items: center; margin-top: auto; }
        .btn-acao {
            background: var(--orange-neon); color: var(--white-ice); border: none; padding: 10px 25px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: all 0.2s ease;
        }
        .btn-acao:hover { background: #e56000; transform: scale(1.05); }

        /* SEÇÃO CONTATOS */
        .secao-contatos { background: rgba(0, 25, 53, 0.9); border-top: 1px solid rgba(255,255,255,0.1); padding: 60px 5%; text-align: center; }
        .secao-contatos h2 { margin-bottom: 10px; font-size: 2rem; color: var(--white-ice); }
        .secao-contatos p { margin-bottom: 40px; color: rgba(244, 247, 250, 0.7); max-width: 600px; margin-left: auto; margin-right: auto; }
        .baloes-contato { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
        .balao-link { display: flex; align-items: center; gap: 10px; padding: 15px 30px; border-radius: 30px; text-decoration: none; color: white; font-weight: bold; font-size: 1rem; transition: transform 0.3s ease; }
        .balao-link:hover { transform: translateY(-5px); }
        .btn-wpp { background-color: #25D366; }
        .btn-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-email { background-color: var(--blue-mid); }

        /* BOTÃO FLUTUANTE DE CARRINHO */
        .btn-flutuante-carrinho {
            position: fixed; bottom: 30px; right: 30px; background: var(--orange-neon); color: white;
            border: none; padding: 15px 25px; border-radius: 30px; font-weight: bold; font-size: 1rem;
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4); cursor: pointer; z-index: 50;
            display: none; align-items: center; gap: 10px; transition: transform 0.3s ease;
        }
        .btn-flutuante-carrinho:hover { transform: scale(1.05); background: #e56000; }

        /* MODAL E FORMULÁRIO */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 25, 53, 0.8);
            backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; padding: 20px;
        }
        .modal-overlay.ativo { opacity: 1; }
        .modal-box {
            background: var(--bg-dark); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 450px;
            border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(20px); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.ativo .modal-box { transform: translateY(0); }
        .icone-sucesso { width: 70px; height: 70px; background: rgba(255, 107, 0, 0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; color: var(--orange-neon); font-size: 2rem; }
        
        .modal-box h2 { margin-bottom: 5px; color: var(--orange-neon); }
        .modal-box p { color: rgba(244, 247, 250, 0.9); margin-bottom: 25px; }

        #listaServicosSelecionados { list-style: none; padding: 0; margin-bottom: 25px; text-align: center; }
        #listaServicosSelecionados li { color: var(--orange-neon); font-weight: bold; margin-bottom: 5px; font-size: 1.1rem; }

        .form-grupo { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; text-align: left; }
        .form-grupo input, .form-grupo textarea, .form-grupo select {
            width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05); color: white; font-size: 1rem; outline: none;
        }
        .form-grupo select option { background: var(--bg-dark); color: white; }
        .form-grupo textarea { resize: vertical; min-height: 80px; }
        .form-grupo input:focus, .form-grupo textarea:focus, .form-grupo select:focus { border-color: var(--orange-neon); }
        .form-grupo input::placeholder, .form-grupo textarea::placeholder { color: rgba(255,255,255,0.4); }

        .btn-modal { color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.3s ease; margin-bottom: 10px; }
        .btn-verde { background: #25D366; }
        .btn-verde:hover { background: #20b858; }
        .btn-laranja { background: var(--orange-neon); }
        .btn-laranja:hover { background: #e56000; }
        
        .btn-fechar-modal { background: transparent; color: rgba(244, 247, 250, 0.5); border: none; cursor: pointer; transition: color 0.3s ease; margin-top: 5px; }
        .btn-fechar-modal:hover { color: var(--white-ice); }
    </style>
</head>
<body>

    <script src="textos-do-site.js"></script>
    <script src="servicos.js"></script>

    <video class="video-fundo" autoplay loop muted playsinline>
        <source src="VideoDeFundo.mp4" type="video/mp4">
    </video>
    <div class="overlay-video"></div>

    <header>
        <img src="Logo-Cabecalho-Site.svg" alt="ZNT" class="logo-empresa">
        <nav class="navbar">
            <a href="#sobre" id="txt_nav_sobre"></a>
            <a href="#contatos" id="txt_nav_contatos"></a>
        </nav>
    </header>

    <section class="hero" id="sobre">
        <h1>
            <span id="txt_hero_titulo"></span> <br>
            <span class="highlight" id="txt_hero_destaque"></span>

    <div class="filtros-wrapper">
        <div class="filtros">
            <button class="btn-filtro ativo" onclick="filtrar('todos')" id="txt_filtro_todos"></button>
            <button class="btn-filtro" onclick="filtrar('hardware')" id="txt_filtro_hardware"></button>
            <button class="btn-filtro" onclick="filtrar('software')" id="txt_filtro_software"></button>
            <button class="btn-filtro" onclick="filtrar('dados')" id="txt_filtro_dados"></button>
        </div>

    <div class="container">
        <main class="catalogo" id="catalogo-grid">
            <!-- Serviços injetados via JS -->
        </main>
    </div>

    <section class="secao-contatos" id="contatos">
        <h2 id="txt_contato_titulo">Fale Conosco</h2>
        <p id="txt_contato_descricao">Estamos prontos para atender você.</p>
        <div class="baloes-contato">
            <a href="https://wa.me/5531995896050" target="_blank" class="balao-link btn-wpp">💬 WhatsApp</a>
            <a href="https://www.instagram.com/zenitth.ti" target="_blank" class="balao-link btn-insta">📸 Instagram</a>
            <a href="mailto:zenitth.ti@gmail.com" target="_blank" class="balao-link btn-email">✉️ E-mail</a>
        </div>
    </section>

    <button id="btnFlutuanteCarrinho" class="btn-flutuante-carrinho" onclick="abrirModalCarrinho()"></button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="icone-sucesso">✓</div>
            <h2 id="txt_modal_titulo">Excelente escolha!</h2>
            
            <p><span id="txt_modal_subtitulo"></span></p>
            <ul id="listaServicosSelecionados"></ul>
            
            <div class="form-grupo">
                <input type="text" id="inputNome" placeholder="Seu Nome e Sobrenome">
                <input type="tel" id="inputTelefone" placeholder="Seu Telefone / WhatsApp" maxlength="15">
                
                <select id="inputDispositivo" style="display: none;">
                    <option value="" disabled selected id="txt_modal_select_dispositivo">Qual o seu dispositivo?</option>
                    <option value="Desktop">Desktop (Computador de Mesa)</option>
                    <option value="Notebook">Notebook</option>
                </select>
                
                <textarea id="inputProblema" placeholder="Descrição breve do problema" style="display: none;"></textarea>
            </div>

            <button class="btn-modal btn-verde" onclick="enviarWhatsApp()" id="txt_modal_btn_avancar">Solicitar no WhatsApp</button>
            <button class="btn-modal btn-laranja" onclick="fecharModal()" id="txt_modal_btn_adicionar" style="display: none;">Adicionar mais serviços</button>
            <button class="btn-fechar-modal" onclick="fecharModal()" id="txt_modal_btn_cancelar">Cancelar</button>
        </div>
    </div>

    <script>
        let modoGeral = false;
        let carrinho = [];

        function aplicarConteudo(idElemento, configTexto) {
            const elemento = document.getElementById(idElemento);
            if (elemento && configTexto) {
                if (configTexto.texto !== undefined) {
                    if (elemento.tagName === 'INPUT' || elemento.tagName === 'TEXTAREA') {
                        elemento.placeholder = configTexto.texto;
                    } else {
                        elemento.textContent = configTexto.texto;
                    }
                }
                if (configTexto.tamanho && configTexto.tamanho !== "") {
                    elemento.style.fontSize = configTexto.tamanho;
                }
            }
        }

        function carregarTextos() {
            aplicarConteudo('txt_nav_sobre', TEXTOS.nav_sobre);
            aplicarConteudo('txt_nav_contatos', TEXTOS.nav_contatos);
            aplicarConteudo('txt_hero_titulo', TEXTOS.hero_titulo);
            aplicarConteudo('txt_hero_destaque', TEXTOS.hero_destaque);
            aplicarConteudo('txt_hero_descricao', TEXTOS.hero_descricao);
            aplicarConteudo('txt_btn_proposta', TEXTOS.btn_proposta);
            
            aplicarConteudo('txt_filtro_todos', TEXTOS.filtro_todos);
            aplicarConteudo('txt_filtro_hardware', TEXTOS.filtro_hardware);
            aplicarConteudo('txt_filtro_software', TEXTOS.filtro_software);
            aplicarConteudo('txt_filtro_dados', TEXTOS.filtro_dados);

            aplicarConteudo('txt_contato_titulo', TEXTOS.contato_titulo);
            aplicarConteudo('txt_contato_descricao', TEXTOS.contato_descricao);

            aplicarConteudo('txt_modal_titulo', TEXTOS.modal_titulo);
            aplicarConteudo('inputNome', TEXTOS.modal_input_nome);
            aplicarConteudo('inputTelefone', TEXTOS.modal_input_telefone);
            aplicarConteudo('inputProblema', TEXTOS.modal_input_problema);
            aplicarConteudo('txt_modal_select_dispositivo', TEXTOS.modal_select_dispositivo);
            
            aplicarConteudo('txt_modal_btn_avancar', TEXTOS.modal_btn_avancar);
            aplicarConteudo('txt_modal_btn_adicionar', TEXTOS.modal_btn_adicionar);
            aplicarConteudo('txt_modal_btn_cancelar', TEXTOS.modal_btn_cancelar);
        }

        function carregarServicos() {
            const grid = document.getElementById('catalogo-grid');
            grid.innerHTML = '';

            SERVICOS.forEach(servico => {
                const tagsHTML = servico.tags.map(tag => `<span class="tag tag-categoria">${tag}</span>`).join('');
                const detalhesHTML = servico.detalhes.map(detalhe => `<li>${detalhe}</li>`).join('');

                const cartao = `
                    <div class="cartao" data-categoria="${servico.categoria}">
                        <div class="tags">${tagsHTML}</div>
                        <h3>${servico.titulo}</h3>
                        <p class="desc-curta">${servico.desc_curta}</p>
                        <div class="detalhes-tecnicos"><ul>${detalhesHTML}</ul></div>
                        <div class="rodape-cartao">
                            <button class="btn-acao" onclick="adicionarAoCarrinho('${servico.titulo}')">Solicitar</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cartao;
            });
        }

        function filtrar(categoria) {
            const cartoes = document.querySelectorAll('.cartao');
            const botoes = document.querySelectorAll('.btn-filtro');
            
            botoes.forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');

            cartoes.forEach(cartao => {
                if (categoria === 'todos' || cartao.getAttribute('data-categoria') === categoria) {
                    cartao.style.display = 'flex';
                    cartao.style.animation = 'fadein 0.5s ease forwards';
                } else {
                    cartao.style.display = 'none';
                }
            });
        }

        const modal = document.getElementById('modalOverlay');

        function atualizarBotaoFlutuante() {
            const btn = document.getElementById('btnFlutuanteCarrinho');
            if (carrinho.length > 0) {
                btn.style.display = 'flex';
                const textoBtn = TEXTOS.btn_ver_pedido ? TEXTOS.btn_ver_pedido.texto : "Finalizar Cotações";
                btn.innerHTML = `🛒 ${textoBtn} (${carrinho.length})`;
            } else {
                btn.style.display = 'none';
            }
        }

        function adicionarAoCarrinho(nomeServico) {
            modoGeral = false;
            if (!carrinho.includes(nomeServico)) {
                carrinho.push(nomeServico);
            }
            atualizarBotaoFlutuante();
            abrirModalCarrinho();
        }

        function verificaExigenciaDispositivo() {
            let exige = false;
            carrinho.forEach(nomeServico => {
                const servicoEncontrado = SERVICOS.find(s => s.titulo === nomeServico);
                if (servicoEncontrado && servicoEncontrado.exige_dispositivo) {
                    exige = true;
                }
            });
            return exige;
        }

        function abrirModalCarrinho() {
            modoGeral = false;
            document.getElementById('inputProblema').style.display = 'none';
            document.getElementById('listaServicosSelecionados').style.display = 'block';
            document.getElementById('txt_modal_btn_adicionar').style.display = 'block';
            
            if (verificaExigenciaDispositivo()) {
                document.getElementById('inputDispositivo').style.display = 'block';
            } else {
                document.getElementById('inputDispositivo').style.display = 'none';
            }
            
            if (carrinho.length > 1) {
                document.getElementById('txt_modal_subtitulo').textContent = "Você selecionou os serviços:";
            } else {
                aplicarConteudo('txt_modal_subtitulo', TEXTOS.modal_subtitulo);
            }
            
            let ul = document.getElementById('listaServicosSelecionados');
            ul.innerHTML = '';
            carrinho.forEach(s => {
                ul.innerHTML += `<li>${s}</li>`;
            });
            
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('ativo'); }, 10);
        }

        function abrirModalGeral() {
            modoGeral = true;
            document.getElementById('inputProblema').style.display = 'block';
            document.getElementById('listaServicosSelecionados').style.display = 'none';
            document.getElementById('txt_modal_btn_adicionar').style.display = 'none';
            
            document.getElementById('inputDispositivo').style.display = 'block';
            document.getElementById('inputDispositivo').value = '';
            
            aplicarConteudo('txt_modal_subtitulo', TEXTOS.modal_subtitulo_geral);
            
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('ativo'); }, 10);
        }

        function fecharModal() {
            modal.classList.remove('ativo');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        modal.addEventListener('click', function(e) {
            if(e.target === this) fecharModal();
        });

        function aplicarMascaraTelefone(evento) {
            let input = evento.target;
            let valor = input.value.replace(/\D/g, ''); 

            if (valor.length > 11) valor = valor.slice(0, 11);

            let formatado = valor;
            if (valor.length > 10) {
                formatado = valor.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
            } else if (valor.length > 6) {
                formatado = valor.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (valor.length > 2) {
                formatado = valor.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            } else if (valor.length > 0) {
                formatado = valor.replace(/^(\d*)/, '($1');
            }
            
            input.value = formatado;
        }

        function enviarWhatsApp() {
            const nomeCliente = document.getElementById('inputNome').value.trim() || '[Não informado]';
            const telefoneCliente = document.getElementById('inputTelefone').value.trim() || '[Não informado]';
            const dispositivo = document.getElementById('inputDispositivo').value || 'Equipamento não especificado';
            
            // Variáveis universais seguras (Evita quebra de encoding)
            const emojiAzul = '\uD83D\uDD39'; 
            const emojiPC = '\uD83D\uDCBB';
            
            let mensagem = `Olá, Zenith TI.\n\n`;
            
            if (modoGeral) {
                let problema = document.getElementById('inputProblema').value.trim() || '[Não detalhou o problema]';
                
                mensagem += `Gostaria de solicitar uma avaliação do meu *${dispositivo}*.\n\n`;
                mensagem += `${emojiAzul} *Motivo da solicitação:* ${problema}\n\n`;
            } else {
                if (carrinho.length === 1) {
                    mensagem += `Gostaria de solicitar um orçamento para o serviço de:\n\n`;
                    mensagem += `${emojiAzul} *${carrinho[0]}*\n\n`;
                } else if (carrinho.length > 1) {
                    mensagem += `Gostaria de solicitar um orçamento para os serviços de:\n\n`;
                    carrinho.forEach(s => {
                        mensagem += `${emojiAzul} *${s}*\n`;
                    });
                    mensagem += `\n`;
                }
                
                if (verificaExigenciaDispositivo()) {
                    mensagem += `${emojiPC} *Dispositivo relacionado:* ${dispositivo}\n\n`;
                }
            }
            
            mensagem += `= = = = = = = = = = = = = = = = = = = = = =\n\n`;
            mensagem += `Para agilizar o atendimento, seguem meus dados:\n\n`;
            
            if (modoGeral) {
                mensagem += `${emojiAzul} Nome: ${nomeCliente}\n`;
                mensagem += `${emojiAzul} Telefone: ${telefoneCliente}\n\n`;
            } else {
                mensagem += `${emojiAzul} *Nome:* ${nomeCliente}\n`;
                mensagem += `${emojiAzul} *Telefone:* ${telefoneCliente}\n\n`;
            }
            
            mensagem += `Fico no aguardo do retorno. Obrigado(a)!`;

            const url = `https://wa.me/5531995896050?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
            
            carrinho = [];
            document.getElementById('inputNome').value = '';
            document.getElementById('inputTelefone').value = '';
            document.getElementById('inputProblema').value = '';
            document.getElementById('inputDispositivo').value = '';
            atualizarBotaoFlutuante();
            fecharModal();
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarTextos();
            carregarServicos();
            document.getElementById('inputTelefone').addEventListener('input', aplicarMascaraTelefone);
        });
    </script>
</body>
</html>
