<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Serviços - ZNT</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="logo-section">
                <img src="./Logo-Cabecalho-Site.png" alt="Logo Zenith TI" class="logo-icon" style="height: 40px; object-fit: contain;">
                <h1 class="logo-titulo">ZNT</h1>
            </div>
            <nav class="navbar">
                <a href="#home" id="nav-sobre">Sobre nós</a>
                <a href="#contato" id="nav-contato">Contatos</a>
            </nav>
        </div>
    </header>

    <!-- HERO SECTION (COM VÍDEO DE FUNDO) -->
    <section class="hero" id="home">
        <!-- Vídeo em loop -->
        <video class="video-bg" autoplay loop muted playsinline>
            <source src="./VideoDeFundo.mp4" type="video/mp4">
        </video>
        <!-- Camada escura/gradiente por cima do vídeo para dar leitura ao texto -->
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <p id="hero-tag" class="tag-destaque"></p>
            <h1 id="hero-titulo">Carregando...</h1>
            <h2 id="hero-titulo-destaque" style="font-size: 32px; margin-bottom: 20px; font-weight: 300;"></h2>
            <p id="hero-descricao"></p>
            
            <div class="search-bar">
                <input type="text" placeholder="Busque um serviço...">
            </div>
        </div>
    </section>

    <!-- FILTROS -->
    <section class="filtros">
        <div class="container">
            <h2>Filtrar por Categoria</h2>
            <div class="botoes-filtro">
                <!-- As categorias agora batem exatamente com as do seu servicos-site.txt -->
                <button class="btn btn-ativo" onclick="filtrarServicos('todos', this)">Todos</button>
                <button class="btn" onclick="filtrarServicos('suporte', this)">Suporte</button>
                <button class="btn" onclick="filtrarServicos('software', this)">Software</button>
                <button class="btn" onclick="filtrarServicos('hardware', this)">Hardware</button>
                <button class="btn" onclick="filtrarServicos('redes', this)">Redes</button>
                <button class="btn" onclick="filtrarServicos('deslocamento', this)">Deslocamento</button>
            </div>
        </div>
    </section>

    <!-- GRID DE SERVIÇOS -->
    <section class="servicos" id="servicos">
        <div class="container">
            <h2>Nossos Serviços</h2>
            <div class="servicos-grid">
                <!-- Serviços serão injetados aqui -->
            </div>
        </div>
    </section>

    <!-- MODAL DE DETALHES -->
    <div class="modal-detalhes" style="display: none;">
        <div class="modal-content"></div>
    </div>

    <!-- FOOTER -->
    <footer class="footer" id="contato">
        <div class="container">
            <p id="footer-texto">&copy; 2026 Zenith TI. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="./carregador-dinamico.js"></script>
</body>
</html>
