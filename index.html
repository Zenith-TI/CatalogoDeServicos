<!--
=========================================================
TÍTULO: ZNT - Catálogo de Serviços
ÚLTIMA MUDANÇA: Remoção estrutural da tag superior da Hero Section. Implementação de "position: sticky" no container de filtros (filtros-wrapper), criando uma barra de navegação de categorias flutuante ancorada abaixo do cabeçalho durante a rolagem. 
DATA E HORA: 08 de Setembro de 2026, 22:20
VERSÃO: 11.5
=========================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNT - Catálogo de Serviços</title>
    
    <link rel="icon" type="image/png" href="Logo-Cabecalho-Site.png">
    <link rel="apple-touch-icon" href="Logo-Cabecalho-Site.png">
    <meta name="apple-mobile-web-app-title" content="ZNT">

    <style>
        :root {
            --bg-dark: #001935;
            --blue-mid: #1E599C;
            --orange-neon: #FF6B00;
            --white-ice: #F4F7FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white-ice);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .video-fundo {
            position: fixed;
            top: 0; left: 0;
            min-width: 100vw; min-height: 100vh;
            z-index: -2;
            object-fit: cover;
            opacity: 0.25;
        }

        .overlay-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 25, 53, 0.85);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--bg-dark);
            border-bottom: 3px solid var(--orange-neon);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-empresa {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.5));
        }

        .navbar {
            display: flex;
            gap: 25px;
        }

        .navbar a {
            color: var(--white-ice);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .navbar a:hover { color: var(--orange-neon); }

        .hero {
            padding: 60px 5% 40px 5%;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
        }

        .hero h1 {
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            color: var(--white-ice);
        }

        .hero h1 .highlight { color: var(--orange-neon); }

        .hero p {
            color: rgba(244, 247, 250, 0.8);
            line-height: 1.6;
            max-width: 700px;
            margin-bottom: 35px;
        }

        .btn-primario {
            background: var(--orange-neon);
            color: var(--white-ice);
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primario:hover { 
            transform: scale(1.05); 
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }

        /* Envoltório da barra de filtros para efeito pegajoso (Sticky) */
        .filtros-wrapper {
            position: sticky;
            top: 73px; /* Altura aproximada do cabeçalho para travar logo abaixo */
            z-index: 9;
            background: rgba(0, 25, 53, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 0;
            margin-bottom: 40px;
        }

        .filtros {
            text-align: left;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 5%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .btn-filtro {
            background: rgba(244, 247, 250, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(244, 247, 250, 0.2);
            color: var(--white-ice);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-filtro:hover, .btn-filtro.ativo {
            background: var(--blue-mid);
            border-color: var(--blue-mid);
            box-shadow: 0 4px 15px rgba(30, 89, 156, 0.4);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto 60px auto;
            padding: 0 5%;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .cartao {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .cartao:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 107, 0, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .cartao::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--orange-neon);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .cartao:hover::before { transform: scaleX(1); }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .tag-categoria { background: var(--blue-mid); color: var(--white-ice); }

        .cartao h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--white-ice);
        }

        .desc-curta {
            font-size: 0.95rem;
            color: rgba(244, 247, 250, 0.7);
            margin-bottom: 20px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .detalhes-tecnicos {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .detalhes-tecnicos ul { list-style: none; }

        .detalhes-tecnicos li {
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            color: rgba(244, 247, 250, 0.9);
        }

        .detalhes-tecnicos li::before {
            content: '✓';
            color: var(--orange-neon);
            margin-right: 10px;
            font-weight: bold;
        }

        .detalhes-tecnicos li:last-child { margin-bottom: 0; }

        .rodape-cartao {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: auto;
        }

        .btn-acao {
            background: var(--orange-neon);
            color: var(--white-ice);
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-acao:hover {
            background: #e56000;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 25, 53, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.ativo { opacity: 1; }

        .modal-box {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.ativo .modal-box { transform: translateY(0); }

        .icone-sucesso {
            width: 70px; height: 70px;
            background: rgba(255, 107, 0, 0.1);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto;
            color: var(--orange-neon);
            font-size: 2rem;
        }

        .modal-box h2 {
            margin-bottom: 10px; color: var(--white-ice);
        }

        .modal-box p {
            color: rgba(244, 247, 250, 0.7); margin-bottom: 25px; line-height: 1.6;
        }

        .modal-box strong { color: var(--orange-neon); }

        .btn-modal {
            background: var(--blue-mid);
            color: var(--white-ice);
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-modal:hover { background: #15457a; }

        .btn-fechar-modal {
            background: transparent;
            color: rgba(244, 247, 250, 0.5);
            border: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .btn-fechar-modal:hover { color: var(--white-ice); }

        @keyframes fadein { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <!-- Importação dos arquivos externos -->
    <script src="textos-do-site.js"></script>
    <script src="servicos.js"></script>

    <video class="video-fundo" autoplay loop muted playsinline>
        <source src="VideoDeFundo.mp4" type="video/mp4">
    </video>
    <div class="overlay-video"></div>

    <header>
        <img src="Logo-Cabecalho-Site.png" alt="ZNT" class="logo-empresa">
        <nav class="navbar">
            <a href="#sobre" id="txt_nav_sobre"></a>
            <a href="#contatos" id="txt_nav_contatos"></a>
        </nav>
    </header>

    <section class="hero">
        <h1>
            <span id="txt_hero_titulo"></span> <br>
            <span class="highlight" id="txt_hero_destaque"></span>
        </h1>
        <p id="txt_hero_descricao"></p>
        <div class="hero-botoes">
            <button class="btn-primario" id="txt_btn_proposta"></button>
        </div>
    </section>

    <!-- Envoltório com position sticky para travar os botões ao rolar -->
    <div class="filtros-wrapper">
        <div class="filtros">
            <button class="btn-filtro ativo" onclick="filtrar('todos')" id="txt_filtro_todos"></button>
            <button class="btn-filtro" onclick="filtrar('hardware')" id="txt_filtro_hardware"></button>
            <button class="btn-filtro" onclick="filtrar('software')" id="txt_filtro_software"></button>
            <button class="btn-filtro" onclick="filtrar('dados')" id="txt_filtro_dados"></button>
        </div>
    </div>

    <div class="container">
        <main class="catalogo" id="catalogo-grid">
            <!-- Serviços injetados dinamicamente via JS -->
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="icone-sucesso">✓</div>
            <h2 id="txt_modal_titulo"></h2>
            <p><span id="txt_modal_subtitulo"></span> <br><strong id="nomeServicoSelecionado"></strong>.</p>
            <p style="font-size: 0.9rem;" id="txt_modal_aviso"></p>
            <button class="btn-modal" id="txt_modal_btn_avancar"></button>
            <button class="btn-fechar-modal" onclick="fecharModal()" id="txt_modal_btn_cancelar"></button>
        </div>
    </div>

    <script>
        function aplicarConteudo(idElemento, configTexto) {
            const elemento = document.getElementById(idElemento);
            if (elemento && configTexto) {
                if (configTexto.texto !== undefined) {
                    elemento.textContent = configTexto.texto;
                }
                if (configTexto.tamanho && configTexto.tamanho !== "") {
                    elemento.style.fontSize = configTexto.tamanho;
                }
            }
        }

        function carregarTextos() {
            aplicarConteudo('txt_nav_sobre', TEXTOS.nav_sobre);
            aplicarConteudo('txt_nav_contatos', TEXTOS.nav_contatos);
            aplicarConteudo('txt_hero_titulo', TEXTOS.hero_titulo);
            aplicarConteudo('txt_hero_destaque', TEXTOS.hero_destaque);
            aplicarConteudo('txt_hero_descricao', TEXTOS.hero_descricao);
            aplicarConteudo('txt_btn_proposta', TEXTOS.btn_proposta);
            
            aplicarConteudo('txt_filtro_todos', TEXTOS.filtro_todos);
            aplicarConteudo('txt_filtro_hardware', TEXTOS.filtro_hardware);
            aplicarConteudo('txt_filtro_software', TEXTOS.filtro_software);
            aplicarConteudo('txt_filtro_dados', TEXTOS.filtro_dados);

            aplicarConteudo('txt_modal_titulo', TEXTOS.modal_titulo);
            aplicarConteudo('txt_modal_subtitulo', TEXTOS.modal_subtitulo);
            aplicarConteudo('txt_modal_aviso', TEXTOS.modal_aviso);
            aplicarConteudo('txt_modal_btn_avancar', TEXTOS.modal_btn_avancar);
            aplicarConteudo('txt_modal_btn_cancelar', TEXTOS.modal_btn_cancelar);
        }

        function carregarServicos() {
            const grid = document.getElementById('catalogo-grid');
            grid.innerHTML = '';

            SERVICOS.forEach(servico => {
                const tagsHTML = servico.tags.map(tag => {
                    return `<span class="tag tag-categoria">${tag}</span>`;
                }).join('');

                const detalhesHTML = servico.detalhes.map(detalhe => `<li>${detalhe}</li>`).join('');

                const cartao = `
                    <div class="cartao" data-categoria="${servico.categoria}">
                        <div class="tags">
                            ${tagsHTML}
                        </div>
                        <h3>${servico.titulo}</h3>
                        <p class="desc-curta">${servico.desc_curta}</p>
                        <div class="detalhes-tecnicos">
                            <ul>
                                ${detalhesHTML}
                            </ul>
                        </div>
                        <div class="rodape-cartao">
                            <button class="btn-acao" onclick="abrirModal('${servico.titulo}')">Solicitar</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cartao;
            });
        }

        function filtrar(categoria) {
            const cartoes = document.querySelectorAll('.cartao');
            const botoes = document.querySelectorAll('.btn-filtro');
            
            botoes.forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');

            cartoes.forEach(cartao => {
                if (categoria === 'todos' || cartao.getAttribute('data-categoria') === categoria) {
                    cartao.style.display = 'flex';
                    cartao.style.animation = 'fadein 0.5s ease forwards';
                } else {
                    cartao.style.display = 'none';
                }
            });
        }

        const modal = document.getElementById('modalOverlay');
        const spanServico = document.getElementById('nomeServicoSelecionado');

        function abrirModal(nomeServico) {
            spanServico.textContent = nomeServico;
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('ativo'); }, 10);
        }

        function fecharModal() {
            modal.classList.remove('ativo');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        modal.addEventListener('click', function(e) {
            if(e.target === this) fecharModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            carregarTextos();
            carregarServicos();
        });
    </script>
</body>
</html>
