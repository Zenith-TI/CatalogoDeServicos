<!--
=========================================================
TÍTULO: ZNT - Catálogo de Serviços
ÚLTIMA MUDANÇA: Substituição da logo do cabeçalho para o formato SVG (Logo-Cabecalho-Site.svg) e atualização do ícone global do site/app (favicon) também para formato SVG (Logo-Simples.svg), garantindo máxima qualidade e escalabilidade vetorial em qualquer tela.
DATA E HORA: 08 de Setembro de 2026, 22:47
VERSÃO: 13.1
=========================================================
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZNT - Catálogo de Serviços</title>
    
    <!-- Ícones para Navegador e Mobile (App) em SVG -->
    <link rel="icon" type="image/svg+xml" href="Logo-Simples.svg">
    <link rel="apple-touch-icon" href="Logo-Simples.svg">
    <meta name="apple-mobile-web-app-title" content="ZNT">

    <style>
        :root {
            --bg-dark: #001935;
            --blue-mid: #1E599C;
            --orange-neon: #FF6B00;
            --white-ice: #F4F7FA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white-ice);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .video-fundo {
            position: fixed;
            top: 0; left: 0;
            min-width: 100vw; min-height: 100vh;
            z-index: -2;
            object-fit: cover;
            opacity: 0.25;
        }

        .overlay-video {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 25, 53, 0.85);
            z-index: -1;
        }

        /* CABEÇALHO - Com Degradê Suave 50/50 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(180deg, var(--bg-dark) 0%, var(--blue-mid) 100%);
            border-bottom: 3px solid var(--orange-neon);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative; 
            z-index: 10;
        }

        .logo-empresa {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0px 2px 5px rgba(0, 0, 0, 0.5));
        }

        .navbar {
            display: flex;
            gap: 25px;
        }

        .navbar a {
            color: var(--white-ice);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .navbar a:hover { color: var(--orange-neon); }

        .hero {
            padding: 60px 5% 40px 5%;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
        }

        .hero h1 {
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 25px;
            color: var(--white-ice);
        }

        .hero h1 .highlight { color: var(--orange-neon); }

        .hero p {
            color: rgba(244, 247, 250, 0.8);
            line-height: 1.6;
            max-width: 700px;
            margin-bottom: 35px;
        }

        .btn-primario {
            background: var(--orange-neon);
            color: var(--white-ice);
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primario:hover { 
            transform: scale(1.05); 
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }

        .filtros-wrapper {
            position: sticky;
            top: 0; 
            z-index: 20;
            background: rgba(0, 25, 53, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 0;
            margin-bottom: 40px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .filtros {
            text-align: left;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 5%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .btn-filtro {
            background: rgba(244, 247, 250, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(244, 247, 250, 0.2);
            color: var(--white-ice);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-filtro:hover, .btn-filtro.ativo {
            background: var(--blue-mid);
            border-color: var(--blue-mid);
            box-shadow: 0 4px 15px rgba(30, 89, 156, 0.4);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto 60px auto;
            padding: 0 5%;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .cartao {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .cartao:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 107, 0, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .tag-categoria { background: var(--blue-mid); color: var(--white-ice); }

        .cartao h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--white-ice);
        }

        .desc-curta {
            font-size: 0.95rem;
            color: rgba(244, 247, 250, 0.7);
            margin-bottom: 20px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .detalhes-tecnicos {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .detalhes-tecnicos ul { list-style: none; }
        .detalhes-tecnicos li {
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            color: rgba(244, 247, 250, 0.9);
        }

        .detalhes-tecnicos li::before {
            content: '✓'; color: var(--orange-neon); margin-right: 10px; font-weight: bold;
        }
        .detalhes-tecnicos li:last-child { margin-bottom: 0; }

        .rodape-cartao {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: auto;
        }

        .btn-acao {
            background: var(--orange-neon);
            color: var(--white-ice);
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn-acao:hover { background: #e56000; transform: scale(1.05); }

        /* SEÇÃO DE CONTATOS NO RODAPÉ */
        .secao-contatos {
            background: rgba(0, 25, 53, 0.9);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 60px 5%;
            text-align: center;
        }
        
        .secao-contatos h2 { margin-bottom: 10px; font-size: 2rem; color: var(--white-ice); }
        .secao-contatos p { margin-bottom: 40px; color: rgba(244, 247, 250, 0.7); max-width: 600px; margin-left: auto; margin-right: auto; }
        
        .baloes-contato {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .balao-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .balao-link:hover { transform: translateY(-5px); }
        
        .btn-wpp { background-color: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3); }
        .btn-email { background-color: var(--blue-mid); box-shadow: 0 4px 15px rgba(30, 89, 156, 0.3); }

        /* MODAL E FORMULÁRIO */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 25, 53, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        .modal-overlay.ativo { opacity: 1; }

        .modal-box {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%; max-width: 450px;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.ativo .modal-box { transform: translateY(0); }

        .modal-box h2 { margin-bottom: 5px; color: var(--orange-neon); }
        .modal-box p { color: rgba(244, 247, 250, 0.9); margin-bottom: 25px; }

        .form-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-grupo input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .form-grupo input:focus { border-color: var(--orange-neon); }
        .form-grupo input::placeholder { color: rgba(255,255,255,0.4); }

        .btn-modal {
            background: #25D366;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
            margin-bottom: 15px;
        }
        .btn-modal:hover { background: #20b858; }

        .btn-fechar-modal {
            background: transparent;
            color: rgba(244, 247, 250, 0.5);
            border: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .btn-fechar-modal:hover { color: var(--white-ice); }
    </style>
</head>
<body>

    <script src="textos-do-site.js"></script>
    <script src="servicos.js"></script>

    <video class="video-fundo" autoplay loop muted playsinline>
        <source src="VideoDeFundo.mp4" type="video/mp4">
    </video>
    <div class="overlay-video"></div>

    <header>
        <!-- Logo alterada para SVG -->
        <img src="Logo-Cabecalho-Site.svg" alt="ZNT" class="logo-empresa">
        <nav class="navbar">
            <a href="#sobre" id="txt_nav_sobre"></a>
            <a href="#contatos" id="txt_nav_contatos"></a>
        </nav>
    </header>

    <section class="hero" id="sobre">
        <h1>
            <span id="txt_hero_titulo"></span> <br>
            <span class="highlight" id="txt_hero_destaque"></span>
        </h1>
        <p id="txt_hero_descricao"></p>
        <div class="hero-botoes">
            <button class="btn-primario" onclick="solicitarOrcamentoGeral()" id="txt_btn_proposta"></button>
        </div>
    </section>

    <div class="filtros-wrapper">
        <div class="filtros">
            <button class="btn-filtro ativo" onclick="filtrar('todos')" id="txt_filtro_todos"></button>
            <button class="btn-filtro" onclick="filtrar('hardware')" id="txt_filtro_hardware"></button>
            <button class="btn-filtro" onclick="filtrar('software')" id="txt_filtro_software"></button>
            <button class="btn-filtro" onclick="filtrar('dados')" id="txt_filtro_dados"></button>
        </div>
    </div>

    <div class="container">
        <main class="catalogo" id="catalogo-grid">
            <!-- Serviços injetados via JS -->
        </main>
    </div>

    <section class="secao-contatos" id="contatos">
        <h2 id="txt_contato_titulo">Fale Conosco</h2>
        <p id="txt_contato_descricao">Estamos prontos para atender você. Escolha o melhor canal abaixo.</p>
        <div class="baloes-contato">
            <a href="https://wa.me/5531995896050" target="_blank" class="balao-link btn-wpp">💬 WhatsApp</a>
            <a href="https://www.instagram.com/zenitth.ti" target="_blank" class="balao-link btn-insta">📸 Instagram</a>
            <a href="mailto:zenitth.ti@gmail.com" target="_blank" class="balao-link btn-email">✉️ E-mail</a>
        </div>
    </section>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 id="txt_modal_titulo">Excelente escolha!</h2>
            <p><span id="txt_modal_subtitulo"></span> <br><strong id="nomeServicoSelecionado"></strong></p>
            
            <div class="form-grupo">
                <input type="text" id="inputNome" placeholder="Seu Nome e Sobrenome">
                <input type="tel" id="inputTelefone" placeholder="Seu Telefone / WhatsApp">
                <input type="text" id="inputEndereco" placeholder="Seu Endereço completo">
            </div>

            <button class="btn-modal" onclick="enviarWhatsApp()" id="txt_modal_btn_avancar">Solicitar no WhatsApp</button>
            <button class="btn-fechar-modal" onclick="fecharModal()" id="txt_modal_btn_cancelar">Cancelar</button>
        </div>
    </div>

    <script>
        function aplicarConteudo(idElemento, configTexto) {
            const elemento = document.getElementById(idElemento);
            if (elemento && configTexto) {
                if (configTexto.texto !== undefined) {
                    if (elemento.tagName === 'INPUT') elemento.placeholder = configTexto.texto;
                    else elemento.textContent = configTexto.texto;
                }
                if (configTexto.tamanho && configTexto.tamanho !== "") {
                    elemento.style.fontSize = configTexto.tamanho;
                }
            }
        }

        function carregarTextos() {
            aplicarConteudo('txt_nav_sobre', TEXTOS.nav_sobre);
            aplicarConteudo('txt_nav_contatos', TEXTOS.nav_contatos);
            aplicarConteudo('txt_hero_titulo', TEXTOS.hero_titulo);
            aplicarConteudo('txt_hero_destaque', TEXTOS.hero_destaque);
            aplicarConteudo('txt_hero_descricao', TEXTOS.hero_descricao);
            aplicarConteudo('txt_btn_proposta', TEXTOS.btn_proposta);
            
            aplicarConteudo('txt_filtro_todos', TEXTOS.filtro_todos);
            aplicarConteudo('txt_filtro_hardware', TEXTOS.filtro_hardware);
            aplicarConteudo('txt_filtro_software', TEXTOS.filtro_software);
            aplicarConteudo('txt_filtro_dados', TEXTOS.filtro_dados);

            aplicarConteudo('txt_contato_titulo', TEXTOS.contato_titulo);
            aplicarConteudo('txt_contato_descricao', TEXTOS.contato_descricao);

            aplicarConteudo('txt_modal_titulo', TEXTOS.modal_titulo);
            aplicarConteudo('txt_modal_subtitulo', TEXTOS.modal_subtitulo);
            aplicarConteudo('inputNome', TEXTOS.modal_input_nome);
            aplicarConteudo('inputTelefone', TEXTOS.modal_input_telefone);
            aplicarConteudo('inputEndereco', TEXTOS.modal_input_endereco);
            aplicarConteudo('txt_modal_btn_avancar', TEXTOS.modal_btn_avancar);
            aplicarConteudo('txt_modal_btn_cancelar', TEXTOS.modal_btn_cancelar);
        }

        function carregarServicos() {
            const grid = document.getElementById('catalogo-grid');
            grid.innerHTML = '';

            SERVICOS.forEach(servico => {
                const tagsHTML = servico.tags.map(tag => `<span class="tag tag-categoria">${tag}</span>`).join('');
                const detalhesHTML = servico.detalhes.map(detalhe => `<li>${detalhe}</li>`).join('');

                const cartao = `
                    <div class="cartao" data-categoria="${servico.categoria}">
                        <div class="tags">${tagsHTML}</div>
                        <h3>${servico.titulo}</h3>
                        <p class="desc-curta">${servico.desc_curta}</p>
                        <div class="detalhes-tecnicos"><ul>${detalhesHTML}</ul></div>
                        <div class="rodape-cartao">
                            <button class="btn-acao" onclick="abrirModal('${servico.titulo}')">Solicitar</button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cartao;
            });
        }

        function filtrar(categoria) {
            const cartoes = document.querySelectorAll('.cartao');
            const botoes = document.querySelectorAll('.btn-filtro');
            
            botoes.forEach(btn => btn.classList.remove('ativo'));
            event.target.classList.add('ativo');

            cartoes.forEach(cartao => {
                if (categoria === 'todos' || cartao.getAttribute('data-categoria') === categoria) {
                    cartao.style.display = 'flex';
                    cartao.style.animation = 'fadein 0.5s ease forwards';
                } else {
                    cartao.style.display = 'none';
                }
            });
        }

        const modal = document.getElementById('modalOverlay');
        const spanServico = document.getElementById('nomeServicoSelecionado');

        function abrirModal(nomeServico) {
            spanServico.textContent = nomeServico;
            document.getElementById('inputNome').value = '';
            document.getElementById('inputTelefone').value = '';
            document.getElementById('inputEndereco').value = '';
            
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('ativo'); }, 10);
        }

        function fecharModal() {
            modal.classList.remove('ativo');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        modal.addEventListener('click', function(e) {
            if(e.target === this) fecharModal();
        });

        function enviarWhatsApp() {
            const servico = document.getElementById('nomeServicoSelecionado').textContent;
            const nome = document.getElementById('inputNome').value.trim() || '[Não informado]';
            const telefone = document.getElementById('inputTelefone').value.trim() || '[Não informado]';
            const endereco = document.getElementById('inputEndereco').value.trim() || '[Não informado]';
            
            let mensagem = `Olá, equipe Zenith TI! 👋\n`;
            mensagem += `Gostaria de solicitar um orçamento para o serviço de *${servico}*.\n\n`;
            mensagem += `📋 *Meus Dados para Contato:*\n`;
            mensagem += `👤 *Nome:* ${nome}\n`;
            mensagem += `📞 *Telefone:* ${telefone}\n`;
            mensagem += `📍 *Endereço:* ${endereco}\n\n`;
            mensagem += `Aguardo o retorno de um especialista. Obrigado(a)!`;

            const url = `https://wa.me/5531995896050?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
            fecharModal();
        }

        function solicitarOrcamentoGeral() {
            let mensagem = `Olá, equipe Zenith TI! 👋\n`;
            mensagem += `Gostaria de solicitar uma proposta/orçamento geral. Podem me ajudar?`;
            const url = `https://wa.me/5531995896050?text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarTextos();
            carregarServicos();
        });
    </script>
</body>
</html>
